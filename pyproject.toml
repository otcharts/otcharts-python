[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otcharts"
version = "0.1.0"
description = "Market data from OTC broker books (Pocket Option, Quotex, IQ Option, BinoDex) and the real FX market, as JSON. No dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "OTCharts" }]
keywords = [
    "pocket option api", "quotex api", "iq option api", "binodex api",
    "binary options", "otc", "market data", "forex", "candles", "trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# Nothing. That is the point -- see the README.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.0"]

[project.urls]
Homepage = "https://otcharts.com"
Documentation = "https://otcharts.com/api.html"
Source = "https://github.com/otcharts/otcharts-python"
Issues = "https://github.com/otcharts/otcharts-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/otcharts"]
